<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحرير</title><link rel="stylesheet" href="../style.css"></head>
<body><header><div class="wrap nav"><a class="brand" href="../index.html">📰 نبض الخبر</a><span class="muted">لوحة التحرير</span><span style="flex:1"></span><button id="logout" class="btn">تسجيل الخروج</button></div></header>
<main class="wrap" style="padding-top:25px"><div id="authMsg" class="card"><div class="panel">جاري التحقق...</div></div>
<section id="dashboard" hidden><div class="card"><div class="panel"><h2 id="formTitle">إضافة خبر</h2><form id="form" class="form-grid">
<input id="title" required maxlength="180" placeholder="عنوان الخبر"><input id="category" maxlength="80" placeholder="التصنيف"><input id="slug" maxlength="180" placeholder="الرابط المختصر (مثلاً: news-today)"><input id="excerpt" maxlength="300" placeholder="ملخص قصير"><textarea id="body" required maxlength="100000" placeholder="نص الخبر" style="min-height:220px"></textarea>
<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview" hidden>
<select id="status"><option value="draft">مسودة</option><option value="published">منشور</option></select>
<div><button class="btn primary" type="submit">حفظ الخبر</button> <button id="cancel" class="btn" type="button" hidden>إلغاء التعديل</button></div>
</form><p id="formMsg" class="muted"></p></div></div>
<h2>الأخبار</h2><div id="list" class="admin-list"></div></section></main>
<script type="module" src="admin.js"></script></body></html>
